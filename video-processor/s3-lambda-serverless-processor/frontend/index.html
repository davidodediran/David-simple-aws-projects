<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Processor - Serverless</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e4e7;
      --text-dim: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container { max-width: 960px; margin: 0 auto; padding: 24px; }

    header {
      text-align: center;
      padding: 32px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--text-dim); font-size: 14px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: var(--accent);
    }

    .upload-area p { color: var(--text-dim); margin-top: 8px; font-size: 13px; }

    input[type="file"] { display: none; }

    .form-row {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      align-items: end;
    }

    .form-group { flex: 1; }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    select, button {
      font-family: inherit;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 10px 16px;
      background: var(--bg);
      color: var(--text);
      width: 100%;
    }

    button {
      background: var(--accent);
      border: none;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 16px;
      display: none;
    }

    .progress-bar .fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }

    .status-msg {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 8px;
      display: none;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }

    .file-info .name { font-weight: 500; font-size: 14px; }
    .file-info .size { color: var(--text-dim); font-size: 12px; }
    .file-info .remove { color: var(--red); cursor: pointer; margin-left: auto; font-size: 18px; }

    .jobs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .jobs-table th {
      text-align: left;
      color: var(--text-dim);
      font-weight: 500;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .jobs-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .jobs-table tr:hover { background: rgba(99, 102, 241, 0.05); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-processing { background: rgba(245, 158, 11, 0.15); color: var(--orange); }
    .badge-completed { background: rgba(34, 197, 94, 0.15); color: var(--green); }
    .badge-failed { background: rgba(239, 68, 68, 0.15); color: var(--red); }

    .view-link {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }

    .view-link:hover { text-decoration: underline; }

    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--text-dim);
    }

    /* Results page */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: auto;
      padding: 8px 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-card .value { font-size: 22px; font-weight: 700; color: var(--accent); }
    .stat-card .label { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

    .output-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .output-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .output-card .preview {
      width: 100%;
      height: 140px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 12px;
    }

    .output-card .preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .output-card .info {
      padding: 10px;
    }

    .output-card .info .filename {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .output-card .chips {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .chip {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(99, 102, 241, 0.1);
      color: var(--accent);
    }

    .download-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 6px;
      font-size: 12px;
      border-radius: 6px;
    }

    .expiry-notice {
      text-align: center;
      font-size: 12px;
      color: var(--orange);
      margin-top: 16px;
    }

    #results-view { display: none; }

    @media (max-width: 640px) {
      .form-row { flex-direction: column; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .output-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Video Processor</h1>
    <p class="subtitle">Serverless video processing with AWS Lambda + S3</p>
  </header>

  <!-- Upload View -->
  <div id="upload-view">
    <div class="card">
      <h2>Upload Video</h2>

      <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--text-dim)">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <p>Click or drag a video file here</p>
        <p>Supports MP4, AVI, MKV, MOV, WebM (max 500MB)</p>
      </div>

      <input type="file" id="file-input" accept="video/*">

      <div class="file-info" id="file-info">
        <div>
          <div class="name" id="file-name"></div>
          <div class="size" id="file-size"></div>
        </div>
        <span class="remove" id="file-remove" title="Remove">&times;</span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="mode">Processing Mode</label>
          <select id="mode">
            <option value="all">All (frames + thumbnails + transcode)</option>
            <option value="frames">Extract Frames</option>
            <option value="thumbnails">Generate Thumbnails</option>
            <option value="transcode">Transcode (H.264)</option>
          </select>
        </div>
        <div class="form-group" style="max-width: 200px;">
          <label>&nbsp;</label>
          <button id="upload-btn" disabled>Upload &amp; Process</button>
        </div>
      </div>

      <div class="progress-bar" id="progress-bar">
        <div class="fill" id="progress-fill"></div>
      </div>
      <div class="status-msg" id="status-msg"></div>
    </div>

    <div class="card">
      <h2>Recent Jobs</h2>
      <div id="jobs-container">
        <div class="empty-state">No jobs yet. Upload a video to get started.</div>
      </div>
    </div>
  </div>

  <!-- Results View -->
  <div id="results-view">
    <div class="card">
      <div class="results-header">
        <h2 id="results-title">Job Results</h2>
        <button class="back-btn" onclick="showUploadView()">Back</button>
      </div>

      <div class="stats-grid" id="stats-grid"></div>
      <div class="output-grid" id="output-grid"></div>
      <div class="expiry-notice">Download links expire in 24 hours</div>
    </div>
  </div>
</div>

<script>
// CONFIG - set your API Gateway URL after deploying
const API_URL = window.CONFIG_API_URL || '';

let selectedFile = null;

// DOM
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const fileInfo = document.getElementById('file-info');
const fileName = document.getElementById('file-name');
const fileSize = document.getElementById('file-size');
const fileRemove = document.getElementById('file-remove');
const modeSelect = document.getElementById('mode');
const uploadBtn = document.getElementById('upload-btn');
const progressBar = document.getElementById('progress-bar');
const progressFill = document.getElementById('progress-fill');
const statusMsg = document.getElementById('status-msg');

// Drag and drop
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => { if (fileInput.files.length) selectFile(fileInput.files[0]); });
fileRemove.addEventListener('click', clearFile);
uploadBtn.addEventListener('click', startUpload);

function selectFile(file) {
  const maxSize = 500 * 1024 * 1024;
  if (file.size > maxSize) {
    alert('File too large. Maximum 500MB for Lambda processing.');
    return;
  }
  selectedFile = file;
  fileName.textContent = file.name;
  fileSize.textContent = formatSize(file.size);
  fileInfo.style.display = 'flex';
  uploadBtn.disabled = false;
}

function clearFile() {
  selectedFile = null;
  fileInput.value = '';
  fileInfo.style.display = 'none';
  uploadBtn.disabled = true;
  progressBar.style.display = 'none';
  statusMsg.style.display = 'none';
}

async function startUpload() {
  if (!selectedFile || !API_URL) {
    if (!API_URL) alert('API URL not configured. Set CONFIG_API_URL after deploying.');
    return;
  }

  uploadBtn.disabled = true;
  progressBar.style.display = 'block';
  statusMsg.style.display = 'block';
  statusMsg.textContent = 'Requesting upload URL...';
  progressFill.style.width = '10%';

  try {
    const resp = await fetch(`${API_URL}/upload`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename: selectedFile.name,
        mode: modeSelect.value,
        content_type: selectedFile.type || 'video/mp4',
      }),
    });

    if (!resp.ok) throw new Error('Failed to get upload URL');
    const data = await resp.json();

    statusMsg.textContent = 'Uploading video...';
    progressFill.style.width = '20%';

    const xhr = new XMLHttpRequest();
    xhr.open('PUT', data.upload_url);
    xhr.setRequestHeader('Content-Type', selectedFile.type || 'video/mp4');

    xhr.upload.addEventListener('progress', (e) => {
      if (e.lengthComputable) {
        const pct = 20 + (e.loaded / e.total) * 60;
        progressFill.style.width = pct + '%';
      }
    });

    await new Promise((resolve, reject) => {
      xhr.onload = () => xhr.status < 400 ? resolve() : reject(new Error('Upload failed'));
      xhr.onerror = () => reject(new Error('Upload failed'));
      xhr.send(selectedFile);
    });

    progressFill.style.width = '85%';
    statusMsg.textContent = 'Processing... Lambda is working on your video.';

    // Poll for job completion
    await pollForJob(data.upload_id);

  } catch (err) {
    statusMsg.textContent = 'Error: ' + err.message;
    statusMsg.style.color = 'var(--red)';
  } finally {
    uploadBtn.disabled = false;
  }
}

async function pollForJob(uploadId) {
  const maxAttempts = 60;
  for (let i = 0; i < maxAttempts; i++) {
    await sleep(3000);

    try {
      const resp = await fetch(`${API_URL}/jobs`);
      if (!resp.ok) continue;

      const data = await resp.json();
      const job = data.jobs.find(j => j.input_key && j.input_key.includes(uploadId));

      if (job && job.status === 'completed') {
        progressFill.style.width = '100%';
        statusMsg.textContent = 'Done! Showing results...';
        await sleep(500);
        showResults(job.job_id);
        loadJobs();
        clearFile();
        return;
      }

      if (job && job.status === 'failed') {
        statusMsg.textContent = 'Processing failed: ' + (job.error || 'unknown error');
        statusMsg.style.color = 'var(--red)';
        loadJobs();
        return;
      }
    } catch (e) {
      // keep polling
    }
  }

  statusMsg.textContent = 'Timed out waiting for results. Check the jobs list.';
  loadJobs();
}

async function showResults(jobId) {
  try {
    const resp = await fetch(`${API_URL}/job/${jobId}`);
    if (!resp.ok) throw new Error('Failed to load job');
    const job = await resp.json();

    document.getElementById('upload-view').style.display = 'none';
    document.getElementById('results-view').style.display = 'block';
    document.getElementById('results-title').textContent = `Job ${job.job_id} - ${job.original_filename || 'Video'}`;

    const totalSize = (job.outputs || []).reduce((sum, o) => sum + (o.size || 0), 0);

    const statsGrid = document.getElementById('stats-grid');
    statsGrid.innerHTML = `
      <div class="stat-card"><div class="value">${job.mode || 'all'}</div><div class="label">Mode</div></div>
      <div class="stat-card"><div class="value">${(job.outputs || []).length}</div><div class="label">Output Files</div></div>
      <div class="stat-card"><div class="value">${formatSize(job.input_size || 0)}</div><div class="label">Input Size</div></div>
      <div class="stat-card"><div class="value">${formatSize(totalSize)}</div><div class="label">Total Output</div></div>
    `;

    const grid = document.getElementById('output-grid');
    grid.innerHTML = '';

    for (const output of (job.outputs || [])) {
      const isImage = output.content_type && output.content_type.startsWith('image/');
      const isVideo = output.content_type && output.content_type.startsWith('video/');

      const card = document.createElement('div');
      card.className = 'output-card';
      card.innerHTML = `
        <div class="preview">
          ${isImage ? `<img src="${output.download_url}" alt="${output.filename}" loading="lazy">` :
            isVideo ? '<span>Video file</span>' : '<span>File</span>'}
        </div>
        <div class="info">
          <div class="filename" title="${output.filename}">${output.filename}</div>
          <div class="chips">
            <span class="chip">${output.format}</span>
            <span class="chip">${output.size_display}</span>
            <span class="chip">${output.category}</span>
          </div>
          <a href="${output.download_url}" download="${output.filename}" class="download-btn" target="_blank">
            <button style="font-size:12px;">Download</button>
          </a>
        </div>
      `;
      grid.appendChild(card);
    }
  } catch (err) {
    alert('Error loading results: ' + err.message);
  }
}

function showUploadView() {
  document.getElementById('upload-view').style.display = 'block';
  document.getElementById('results-view').style.display = 'none';
  loadJobs();
}

async function loadJobs() {
  if (!API_URL) return;

  try {
    const resp = await fetch(`${API_URL}/jobs`);
    if (!resp.ok) return;
    const data = await resp.json();
    const container = document.getElementById('jobs-container');

    if (!data.jobs || data.jobs.length === 0) {
      container.innerHTML = '<div class="empty-state">No jobs yet. Upload a video to get started.</div>';
      return;
    }

    let html = `<table class="jobs-table">
      <thead><tr><th>ID</th><th>File</th><th>Mode</th><th>Status</th><th>Outputs</th><th></th></tr></thead><tbody>`;

    for (const job of data.jobs) {
      const statusClass = `badge-${job.status}`;
      html += `<tr>
        <td>${job.job_id}</td>
        <td>${job.original_filename || '-'}</td>
        <td>${job.mode || '-'}</td>
        <td><span class="badge ${statusClass}">${job.status}</span></td>
        <td>${job.output_count || (job.outputs || []).length || 0} files</td>
        <td>${job.status === 'completed' ? `<span class="view-link" onclick="showResults('${job.job_id}')">View</span>` : ''}</td>
      </tr>`;
    }

    html += '</tbody></table>';
    container.innerHTML = html;
  } catch (e) {
    // silent
  }
}

function formatSize(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Load jobs on page load
if (API_URL) loadJobs();
</script>

</body>
</html>
