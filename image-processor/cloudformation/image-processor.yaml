AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless Image Processor - S3 static site, 2 Lambdas (API + Processor), API Gateway, S3 Gateway Endpoint

Parameters:
  EnvironmentName:
    Type: String
    Default: image-processor
    Description: Name prefix for all resources

  PresignExpirySeconds:
    Type: Number
    Default: 3600
    Description: Pre-signed URL expiry in seconds (default 1 hour)

Resources:

  # ==================== NETWORKING (VPC for Lambda) ====================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-b

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-rt

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetA

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetB

  # ==================== S3 VPC GATEWAY ENDPOINT ====================

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ==================== CLOUDWATCH LOGS VPC ENDPOINT ====================

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true

  # ==================== SECURITY GROUPS ====================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for image processor Lambdas
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-lambda-sg

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC interface endpoints
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: HTTPS from Lambda
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpce-sg

  # ==================== S3 BUCKETS ====================

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-website-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-website

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-data-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
          - Id: ExpireProcessed
            Status: Enabled
            Prefix: processed/
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['*']
            MaxAge: 3600
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-data

  # ==================== BUCKET CLEANUP (stack deletion) ====================

  BucketCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-bucket-cleanup-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EmptyBuckets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource:
                  - !GetAtt WebsiteBucket.Arn
                  - !GetAtt DataBucket.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub ${WebsiteBucket.Arn}/*
                  - !Sub ${DataBucket.Arn}/*

  BucketCleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-bucket-cleanup
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BucketCleanupRole.Arn
      Timeout: 300
      MemorySize: 128
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          s3 = boto3.client('s3')

          def empty_bucket(bucket_name):
              print(f'Emptying bucket: {bucket_name}')
              paginator = s3.get_paginator('list_object_versions')
              for page in paginator.paginate(Bucket=bucket_name):
                  objects = []
                  for v in page.get('Versions', []):
                      objects.append({'Key': v['Key'], 'VersionId': v['VersionId']})
                  for m in page.get('DeleteMarkers', []):
                      objects.append({'Key': m['Key'], 'VersionId': m['VersionId']})
                  if objects:
                      s3.delete_objects(Bucket=bucket_name, Delete={'Objects': objects, 'Quiet': True})
                      print(f'Deleted {len(objects)} objects/markers')

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      for bucket in event['ResourceProperties']['BucketNames']:
                          try:
                              empty_bucket(bucket)
                          except Exception as e:
                              print(f'Error emptying {bucket}: {e}')
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(f'Error: {e}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  CleanupBucketsOnDelete:
    Type: Custom::EmptyBuckets
    Properties:
      ServiceToken: !GetAtt BucketCleanupFunction.Arn
      BucketNames:
        - !Ref WebsiteBucket
        - !Ref DataBucket

  # ==================== IAM ROLES ====================

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-api-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UploadAndRead
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub ${DataBucket.Arn}/*
              - Sid: ListData
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DataBucket.Arn

  ProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-processor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadUploads
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${DataBucket.Arn}/uploads/*
              - Sid: WriteProcessed
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/processed/*

  # ==================== LAMBDA FUNCTIONS ====================

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-api
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "body": "Deploy API code"}
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          PRESIGN_EXPIRY_SECONDS: !Ref PresignExpirySeconds
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-api

  ProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-processor
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt ProcessorRole.Arn
      Timeout: 120
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "body": "Deploy processor code"}
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-processor

  ProcessorS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt DataBucket.Arn
      SourceAccount: !Ref AWS::AccountId

  # ==================== S3 EVENT NOTIFICATION (Custom Resource) ====================

  NotificationHelperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-notification-helper-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Notification
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !GetAtt DataBucket.Arn

  NotificationHelperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-notification-helper
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt NotificationHelperRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          s3 = boto3.client('s3')

          def handler(event, context):
              try:
                  bucket = event['ResourceProperties']['Bucket']
                  lambda_arn = event['ResourceProperties']['LambdaArn']
                  prefix = event['ResourceProperties']['Prefix']

                  if event['RequestType'] in ['Create', 'Update']:
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={
                              'LambdaFunctionConfigurations': [{
                                  'LambdaFunctionArn': lambda_arn,
                                  'Events': ['s3:ObjectCreated:*'],
                                  'Filter': {
                                      'Key': {
                                          'FilterRules': [{
                                              'Name': 'prefix',
                                              'Value': prefix,
                                          }]
                                      }
                                  }
                              }]
                          }
                      )
                  elif event['RequestType'] == 'Delete':
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={}
                      )

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(f'Error: {e}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  S3NotificationConfig:
    Type: Custom::S3Notification
    DependsOn: ProcessorS3Permission
    Properties:
      ServiceToken: !GetAtt NotificationHelperFunction.Arn
      Bucket: !Ref DataBucket
      LambdaArn: !GetAtt ProcessorFunction.Arn
      Prefix: uploads/

  # ==================== LAMBDA FUNCTION URL ====================

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !Ref ApiFunction
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - Content-Type
        MaxAge: 3600

  ApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  ApiURL:
    Description: Lambda Function URL (API endpoint)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl

  WebsiteBucketName:
    Description: S3 website bucket name
    Value: !Ref WebsiteBucket

  WebsiteURL:
    Description: Static website URL
    Value: !GetAtt WebsiteBucket.WebsiteURL

  DataBucketName:
    Description: S3 data bucket name (uploads + processed)
    Value: !Ref DataBucket

  ApiFunctionName:
    Description: API Lambda function name
    Value: !Ref ApiFunction

  ProcessorFunctionName:
    Description: Processor Lambda function name
    Value: !Ref ProcessorFunction

  VpcId:
    Description: VPC ID
    Value: !Ref VPC

  S3GatewayEndpointId:
    Description: S3 VPC Gateway Endpoint ID
    Value: !Ref S3GatewayEndpoint
