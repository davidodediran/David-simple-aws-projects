<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Processor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

    h1 { text-align: center; font-size: 2rem; margin-bottom: 8px; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; }

    .card { background: #1e293b; border-radius: 16px; border: 1px solid #334155; padding: 32px; margin-bottom: 32px; }

    .drop-zone { border: 2px dashed #475569; border-radius: 12px; padding: 48px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #60a5fa; background: rgba(96, 165, 250, 0.05); }
    .drop-zone.has-file { border-color: #22c55e; border-style: solid; }
    .drop-zone svg { width: 48px; height: 48px; fill: #64748b; margin-bottom: 12px; }
    .drop-zone p { color: #94a3b8; }
    .drop-zone .filename { color: #22c55e; font-weight: 600; margin-top: 8px; }
    .drop-zone input { display: none; }

    .preview-container { margin-top: 16px; text-align: center; }
    .preview-container img { max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid #334155; }

    .controls { display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
    .controls select { flex: 1; min-width: 200px; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #e2e8f0; font-size: 1rem; cursor: pointer; }
    .controls select:focus { outline: none; border-color: #60a5fa; }

    .btn { padding: 12px 32px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .processing { text-align: center; padding: 48px; }
    .spinner { width: 56px; height: 56px; border: 4px solid #334155; border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .processing-text { color: #94a3b8; }
    .processing-step { color: #60a5fa; font-weight: 600; margin-top: 8px; min-height: 24px; }

    .progress-bar { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-top: 16px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 3px; transition: width 0.5s ease; width: 0%; }

    .results-title { font-size: 1.3rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .results-title .badge { background: #22c55e; color: white; font-size: 0.75rem; padding: 2px 10px; border-radius: 999px; }

    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .result-card { background: #0f172a; border-radius: 12px; border: 1px solid #334155; overflow: hidden; transition: transform 0.2s; }
    .result-card:hover { transform: translateY(-2px); }
    .result-card img { width: 100%; height: 200px; object-fit: cover; cursor: pointer; }
    .result-card .info { padding: 12px 16px; }
    .result-card .filter-name { font-weight: 600; text-transform: capitalize; color: #e2e8f0; }
    .result-card .filter-size { color: #64748b; font-size: 0.85rem; margin-top: 2px; }
    .result-card .actions { padding: 0 16px 12px; }
    .result-card .btn-download { display: inline-block; padding: 6px 16px; font-size: 0.85rem; background: #334155; color: #e2e8f0; border-radius: 6px; text-decoration: none; transition: background 0.2s; }
    .result-card .btn-download:hover { background: #475569; }

    .error { background: #7f1d1d; border: 1px solid #991b1b; color: #fca5a5; padding: 16px; border-radius: 8px; margin-top: 16px; }
    .hidden { display: none !important; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; cursor: pointer; }
    .modal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Image Processor</h1>
    <p class="subtitle">Upload an image, pick a filter, get results instantly</p>

    <!-- Upload Section -->
    <div class="card" id="upload-section">
      <div class="drop-zone" id="drop-zone">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 000 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <p>Drag and drop an image here, or <strong>click to browse</strong></p>
        <p class="filename hidden" id="filename"></p>
        <input type="file" id="file-input" accept="image/*">
      </div>

      <div class="preview-container hidden" id="preview-container">
        <img id="preview-img" alt="Preview">
      </div>

      <div class="controls">
        <select id="mode-select">
          <option value="grayscale">Grayscale</option>
          <option value="thumbnail">Thumbnail (300px)</option>
          <option value="blur">Gaussian Blur</option>
          <option value="sepia">Sepia Tone</option>
          <option value="sharpen">Sharpen</option>
          <option value="edges">Edge Detection</option>
          <option value="rotate">Rotate 90&deg;</option>
          <option value="all">All Filters</option>
        </select>
        <button class="btn btn-primary" id="process-btn" disabled>Upload &amp; Process</button>
      </div>

      <div class="error hidden" id="error-msg"></div>
    </div>

    <!-- Processing Animation -->
    <div class="card hidden" id="processing-section">
      <div class="processing">
        <div class="spinner"></div>
        <p class="processing-text">Processing your image...</p>
        <p class="processing-step" id="processing-step"></p>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>

    <!-- Results Section -->
    <div class="card hidden" id="results-section">
      <div class="results-title">
        Results <span class="badge" id="result-count"></span>
      </div>
      <div class="results-grid" id="results-grid"></div>
    </div>
  </div>

  <!-- Fullscreen modal -->
  <div class="modal hidden" id="modal">
    <img id="modal-img" alt="Full size">
  </div>

  <script>
    const API_URL = window.CONFIG_API_URL || '';

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const filenameEl = document.getElementById('filename');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');
    const modeSelect = document.getElementById('mode-select');
    const processBtn = document.getElementById('process-btn');
    const errorMsg = document.getElementById('error-msg');
    const uploadSection = document.getElementById('upload-section');
    const processingSection = document.getElementById('processing-section');
    const processingStep = document.getElementById('processing-step');
    const progressFill = document.getElementById('progress-fill');
    const resultsSection = document.getElementById('results-section');
    const resultsGrid = document.getElementById('results-grid');
    const resultCount = document.getElementById('result-count');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');

    let selectedFile = null;

    // Drag and drop
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        showError('Please select an image file (JPG, PNG, WEBP, etc.)');
        return;
      }
      if (file.size > 6 * 1024 * 1024) {
        showError('Image must be under 6 MB (API Gateway payload limit)');
        return;
      }
      selectedFile = file;
      filenameEl.textContent = file.name + ' (' + (file.size / 1024 / 1024).toFixed(1) + ' MB)';
      filenameEl.classList.remove('hidden');
      dropZone.classList.add('has-file');
      processBtn.disabled = false;
      hideError();

      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewContainer.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    // Processing animation steps
    const steps = [
      'Reading image data...',
      'Analyzing pixel values...',
      'Applying filter transformation...',
      'Encoding output image...',
      'Uploading to S3...',
      'Generating download URLs...',
      'Almost done...',
    ];

    async function simulateProgress() {
      for (let i = 0; i < steps.length; i++) {
        processingStep.textContent = steps[i];
        progressFill.style.width = ((i + 1) / steps.length * 90) + '%';
        await new Promise(r => setTimeout(r, 400 + Math.random() * 300));
      }
    }

    // Process
    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      hideError();
      uploadSection.classList.add('hidden');
      processingSection.classList.remove('hidden');
      resultsSection.classList.add('hidden');
      progressFill.style.width = '0%';

      const progressPromise = simulateProgress();

      try {
        const base64 = await fileToBase64(selectedFile);
        const mode = modeSelect.value;

        const res = await fetch(API_URL + '/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64, mode, filename: selectedFile.name }),
        });

        await progressPromise;
        progressFill.style.width = '100%';
        processingStep.textContent = 'Done!';

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Processing failed');
        }

        const data = await res.json();
        await new Promise(r => setTimeout(r, 500));
        showResults(data);

      } catch (err) {
        showError(err.message);
        uploadSection.classList.remove('hidden');
      } finally {
        processingSection.classList.add('hidden');
      }
    });

    function showResults(data) {
      resultsGrid.innerHTML = '';
      resultCount.textContent = data.results.length + ' image' + (data.results.length !== 1 ? 's' : '');

      data.results.forEach(r => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <img src="${r.url}" alt="${r.filter}" loading="lazy">
          <div class="info">
            <div class="filter-name">${r.filter}</div>
            <div class="filter-size">${r.size_kb} KB</div>
          </div>
          <div class="actions">
            <a href="${r.url}" target="_blank" class="btn-download">Download</a>
          </div>
        `;
        card.querySelector('img').addEventListener('click', () => {
          modalImg.src = r.url;
          modal.classList.remove('hidden');
        });
        resultsGrid.appendChild(card);
      });

      uploadSection.classList.remove('hidden');
      resultsSection.classList.remove('hidden');
    }

    // Modal
    modal.addEventListener('click', () => modal.classList.add('hidden'));

    // Helpers
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
    }
    function hideError() {
      errorMsg.classList.add('hidden');
    }
  </script>
</body>
</html>
